<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QuizMaster</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f3ff, #ddd6fe);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(76, 29, 149, 0.15);
            text-align: center;
        }

        .logo {
            color: #6d28d9;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
        }

        h2 {
            color: #2e1065;
            margin-bottom: 25px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #3b2765;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd6fe;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px #ede9fe;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6d28d9, #8b5cf6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        .register-text {
            margin-top: 22px;
            color: #555;
        }

        a {
            color: #6d28d9;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 22px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">QuizMaster.</div>

        <p class="subtitle">
            Challenge Your Mind. Discover Your Genius.
        </p>

        <h2>Welcome Back!</h2>

        <form>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Register Now</a>
        </p>

        <a class="back-home" href="index.html">
            ← Back to Home
        </a>

    </div>
    <script>
const API = "https://wajeehatariq.pythonanywhere.com";

document.getElementById("loginBtn").addEventListener("click", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const res = await fetch(API + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) { alert(data.error || "Login failed"); return; }

    localStorage.setItem("qm-name", data.name);
    localStorage.setItem("qm-token", data.token);
    window.location.href = "play.html";
  } catch (err) {
    alert("Cannot reach the server. Try again.");
  }
});
    </script>

</body>
</html>
