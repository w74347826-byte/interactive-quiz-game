
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Interactive Quiz</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .quiz-box {
            max-width: 750px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px #cccccc;
        }

        .quiz-box h1,
        .quiz-box p {
            text-align: center;
        }

        .quiz-button,
        .answer-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .quiz-button {
            background: #2563eb;
            color: white;
        }

        .answer-button {
            background: #e5e7eb;
            color: #111827;
            text-align: left;
        }

        .answer-button:hover {
            background: #bfdbfe;
        }

        #feedback {
            font-weight: bold;
            text-align: center;
        }

        #question-area {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="../index.html">Home</a>
        <a href="../about.html">About</a>
        <a href="../categories.html">Categories</a>
        <a href="../contact.html">Contact</a>
    </nav>

    <main class="quiz-box">
        <h1>HTML Quiz</h1>
        <p>Test your HTML knowledge!</p>

        <label for="difficulty">Choose your difficulty:</label>

        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <button class="quiz-button" id="start-button">
            Start Quiz
        </button>

        <div id="question-area" hidden>
            <p id="progress"></p>
            <h2 id="question"></h2>
            <div id="answers"></div>
            <p id="feedback"></p>
            <button class="quiz-button" id="next-button" hidden>
                Next Question
            </button>
        </div>

        <div id="result-area" hidden>
            <h2>Quiz Finished!</h2>
            <p id="result"></p>
            <button class="quiz-button" id="retry-button">
                Try Again
            </button>
        </div>

        <p><a href="../categories.html">Back to Categories</a></p>
    </main>

    <script>

const questions = {
    easy: [
        { q: "What does HTML stand for?", o: ["Hyper Text Markup Language", "High Tech Modern Language", "Home Tool Markup Language", "Hyperlinks Text Making Language"], a: 0 },
        { q: "Which tag creates the largest heading?", o: ["<h6>", "<h1>", "<head>", "<heading>"], a: 1 },
        { q: "Which tag creates a paragraph?", o: ["<para>", "<text>", "<p>", "<pg>"], a: 2 },
        { q: "Which tag creates a hyperlink?", o: ["<link>", "<href>", "<url>", "<a>"], a: 3 },
        { q: "Which tag displays an image?", o: ["<img>", "<picture-text>", "<image>", "<src>"], a: 0 },
        { q: "Which tag makes an unordered list?", o: ["<ol>", "<ul>", "<li>", "<list>"], a: 1 },
        { q: "Which tag makes a list item?", o: ["<item>", "<ul>", "<li>", "<ol>"], a: 2 },
        { q: "Which tag starts a new line?", o: ["<line>", "<lb>", "<newline>", "<br>"], a: 3 },
        { q: "Which tag makes text bold by importance?", o: ["<strong>", "<i>", "<small>", "<mark>"], a: 0 },
        { q: "Which tag sets the browser tab title?", o: ["<header>", "<title>", "<h1>", "<caption>"], a: 1 },
        { q: "Which tag contains page metadata?", o: ["<body>", "<footer>", "<head>", "<main>"], a: 2 },
        { q: "Which tag contains visible page content?", o: ["<head>", "<meta>", "<title>", "<body>"], a: 3 },
        { q: "Which declaration identifies an HTML5 document?", o: ["<!DOCTYPE html>", "<html5>", "<doctype>", "<document>"], a: 0 },
        { q: "Which attribute gives an image alternative text?", o: ["src", "alt", "href", "title"], a: 1 },
        { q: "Which tag creates a numbered list?", o: ["<ul>", "<li>", "<ol>", "<dl>"], a: 2 }
    ],

    medium: [
        { q: "Which element is used to play video?", o: ["<media>", "<movie>", "<play>", "<video>"], a: 3 },
        { q: "Which attribute specifies an image file?", o: ["src", "href", "alt", "target"], a: 0 },
        { q: "Which tag creates a table row?", o: ["<td>", "<tr>", "<th>", "<table-row>"], a: 1 },
        { q: "Which tag defines a table cell?", o: ["<tr>", "<th>", "<td>", "<cell>"], a: 2 },
        { q: "Which attribute connects a label to an input?", o: ["name", "value", "class", "for"], a: 3 },
        { q: "Which input type hides typed characters?", o: ["password", "hidden-text", "secret", "private"], a: 0 },
        { q: "Which tag defines a navigation section?", o: ["<navigate>", "<nav>", "<links>", "<menu-bar>"], a: 1 },
        { q: "Which tag represents the main page content?", o: ["<section>", "<content>", "<main>", "<primary>"], a: 2 },
        { q: "Which attribute opens a link in a new tab?", o: ["new", "tab", "window", "target='_blank'"], a: 3 },
        { q: "Which tag is used to link an external CSS file?", o: ["<link>", "<css>", "<stylefile>", "<script>"], a: 0 },
        { q: "Which tag embeds JavaScript in HTML?", o: ["<javascript>", "<script>", "<code-js>", "<program>"], a: 1 },
        { q: "Which attribute makes a form field mandatory?", o: ["needed", "must", "required", "validate"], a: 2 },
        { q: "Which tag creates a dropdown list?", o: ["<dropdown>", "<option-list>", "<listbox>", "<select>"], a: 3 },
        { q: "Which tag defines an option in a dropdown?", o: ["<option>", "<select-item>", "<choice>", "<item>"], a: 0 },
        { q: "Which attribute provides a hint inside an input?", o: ["hint", "placeholder", "help", "example"], a: 1 }
    ],

    hard: [
        { q: "Which attribute should be unique on a page?", o: ["class", "style", "id", "title"], a: 2 },
        { q: "Which element is intended for self-contained content?", o: ["<div>", "<span>", "<section>", "<article>"], a: 3 },
        { q: "Which element is suitable for a page footer?", o: ["<footer>", "<bottom>", "<end>", "<last>"], a: 0 },
        { q: "Which attribute associates a form control with a form by ID?", o: ["formname", "form", "owner", "belongs"], a: 1 },
        { q: "Which attribute can help lazy-load an image?", o: ["async", "defer", "loading='lazy'", "late"], a: 2 },
        { q: "Which tag provides a caption for a figure?", o: ["<caption>", "<figtitle>", "<figure-title>", "<figcaption>"], a: 3 },
        { q: "Which element marks up machine-readable dates or values?", o: ["<time>", "<date>", "<datetime>", "<data-time>"], a: 0 },
        { q: "Which attribute links an input to a datalist?", o: ["listid", "list", "options", "choices"], a: 1 },
        { q: "Which element groups related form controls?", o: ["<group>", "<formgroup>", "<fieldset>", "<controls>"], a: 2 },
        { q: "Which element labels a fieldset?", o: ["<label>", "<caption>", "<heading>", "<legend>"], a: 3 },
        { q: "Which attribute can submit a form to a different URL?", o: ["formaction", "actionto", "submiturl", "formurl"], a: 0 },
        { q: "Which attribute controls a form's HTTP method?", o: ["type", "method", "send", "request"], a: 1 },
        { q: "Which element is designed for a disclosure widget?", o: ["<toggle>", "<expand>", "<details>", "<reveal>"], a: 2 },
        { q: "Which element provides the summary for a details widget?", o: ["<caption>", "<label>", "<heading>", "<summary>"], a: 3 },
        { q: "Which attribute declares a page's character encoding?", o: ["charset", "encoding-type", "lang-code", "unicode"], a: 0 }
    ]
};

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
        
function speakText(text) {
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 0.9;

    window.speechSynthesis.speak(speech);
}


const difficulty = document.getElementById("difficulty");
const startButton = document.getElementById("start-button");
const questionArea = document.getElementById("question-area");
const questionText = document.getElementById("question");
const answersArea = document.getElementById("answers");
const progress = document.getElementById("progress");
const feedback = document.getElementById("feedback");
const nextButton = document.getElementById("next-button");
const resultArea = document.getElementById("result-area");
const resultText = document.getElementById("result");
const retryButton = document.getElementById("retry-button");

function startQuiz() {
    currentQuestions = questions[difficulty.value];
    currentIndex = 0;
    score = 0;

    resultArea.hidden = true;
    questionArea.hidden = false;
    difficulty.disabled = true;
    startButton.hidden = true;

    showQuestion();
   
    showQuestion();
}

}

function showQuestion() {
    answered = false;

    const item = currentQuestions[currentIndex];

    progress.textContent =
        "Question " + (currentIndex + 1) +
        " of " + currentQuestions.length +
        " | Score: " + score;

    questionText.textContent = item.q;
    
speakText(
    "Question " + (currentIndex + 1) + ". " + item.q
);

    answersArea.innerHTML = "";
    feedback.textContent = "";
    nextButton.hidden = true;

    item.o.forEach(function (answer, index) {
        const button = document.createElement("button");

        button.className = "answer-button";
        button.textContent = String.fromCharCode(65 + index) + ". " + answer;

        button.addEventListener("click", function () {
          
        });

        answersArea.appendChild(button);
    });
}
        speakText("Correct! Well done!");

function checkAnswer(selectedIndex) {
    if (answered) return;
  feedback.style.color = "red";

    answered = true;

    const item = currentQuestions[currentIndex];
    const buttons = answersArea.querySelectorAll("button");

    buttons.forEach(function (button) {
        speakText"Correct! Well done!";
        speakText("Correct! Well done!");
        button.disabled = true;
    });

    if (selectedIndex === item.a) {
        score++;
        feedback.textContent = "Correct! Well done!";
        feedback.style.color = "green";
    } else {
        feedback.textContent =
            "Incorrect. Correct answer: " + item.o[item.a];
        feedback.style.color = "red";
    }

    progress.textContent =
        "Question " + (currentIndex + 1) +
        " of " + currentQuestions.length +
        " | Score: " + score;

    nextButton.hidden = false;

    if (currentIndex === currentQuestions.length - 1) {
        nextButton.textContent = "See Results";
    } else {
        nextButton.textContent = "Next Question";
    }
}

function showResults() {
    questionArea.hidden = true;
    resultArea.hidden = false;

    const percentage = Math.round(
        (score / currentQuestions.length) * 100
    );

    resultText.textContent =
        "You scored " + score + " out of " +
        currentQuestions.length + " (" +
        percentage + "%). " +
        (percentage >= 80
            ? "Excellent work!"
            : percentage >= 50
            ? "Good effort! Keep practising."
            : "Keep learning and try again!");
}

startButton.addEventListener("click", startQuiz);

nextButton.addEventListener("click", function () {
    if (currentIndex === currentQuestions.length - 1) {
        showResults();
    } else {
        currentIndex++;
        showQuestion();
    }
});

retryButton.addEventListener("click", function () {
    difficulty.disabled = false;
    startButton.hidden = false;
    resultArea.hidden = true;
    questionArea.hidden = true;
    nextButton.textContent = "Next Question";
});

    </script>
</body>
</html>
