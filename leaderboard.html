
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c3bdb">
  <title>Leaderboard | Quiz Master</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f0ff, #ffffff);
      color: #30204d;
    }

    header {
      background: linear-gradient(135deg, #2e1065, #6c3bdb);
      padding: 20px;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #ddd6fe;
    }

    .leaderboard-page {
      max-width: 1000px;
      margin: auto;
      padding: 40px 18px;
    }

    h1 {
      color: #6c3bdb;
      text-align: center;
      font-size: clamp(30px, 6vw, 44px);
    }

    .leaderboard-intro {
      color: #777;
      text-align: center;
      margin-bottom: 30px;
    }

    .score-card {
      background: white;
      border: 1px solid #e5ddff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 8px 25px #37206a10;
    }

    .score-card h2 {
      color: #4c1d95;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 550px;
    }

    th, td {
      padding: 14px 10px;
      border-bottom: 1px solid #eee8ff;
    }

    th {
      color: #6c3bdb;
      background: #f6f2ff;
    }

    .note {
      font-size: 14px;
      color: #777;
      text-align: center;
      margin-top: 20px;
    }

    .refresh-btn {
      display: block;
      margin: 20px auto 0;
      background: #6c3bdb;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #4c1d95;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    @media(max-width: 600px) {
      nav {
        gap: 15px;
      }

      .leaderboard-page {
        padding: 25px 12px;
      }

      .score-card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="play.html">Play</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="login.html">Login</a></li>
    </nav>
  </header>

  <main class="leaderboard-page">

    <h1>🏆 Leaderboard</h1>

    <p class="leaderboard-intro">
      Celebrate your progress and quiz achievements.
    </p>

    <section class="score-card">
      <h2>Player Rankings</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>Category</th>
              <th>Score</th>
              <th>Feedback</th>
            </tr>
          </thead>

          <tbody id="leaderboard-body">
            <tr>
              <td colspan="5">Loading results...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p class="note" id="leaderboard-note">
        Connecting to Python backend...
      </p>

      <button class="refresh-btn" onclick="loadLeaderboard()">
        Refresh Results
      </button>
    </section>

  </main>

  <footer>
    © 2026 QuizMaster. All rights reserved.
  </footer>

  <script>
    async function loadLeaderboard() {
      const body = document.getElementById("leaderboard-body");
      const note = document.getElementById("leaderboard-note");

      body.innerHTML =
        '<tr><td colspan="5">Loading results...</td></tr>';

      try {
        const response = await fetch(
          "https://wajeehatariq.pythonanywhere.com/api/scores"
        );

        if (!response.ok) {
          throw new Error("HTTP error: " + response.status);
        }

        const results = await response.json();

        if (!Array.isArray(results) || results.length === 0) {
          body.innerHTML =
            '<tr><td colspan="5">No saved results yet.</td></tr>';
          note.textContent = "Complete a quiz to see results here.";
          return;
        }

        results.sort(
          (a, b) => Number(b.pct) - Number(a.pct)
        );

        body.innerHTML = "";

        results.forEach((player, index) => {
          const score = Number(player.score) || 0;
          const total = Number(player.total) || 0;
          const percent = Number(player.pct) || 0;

          let feedback = "Keep practicing!";

          if (percent >= 100) {
            feedback = "Excellent!";
          } else if (percent >= 80) {
            feedback = "Great work!";
          } else if (percent >= 60) {
            feedback = "Good effort!";
          }

          const row = document.createElement("tr");

          [
            index + 1,
            player.name || "Guest",
            player.category || "-",
            score + "/" + total,
            feedback
          ].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });

          body.appendChild(row);
        });

        note.textContent =
          "Results received from Python backend.";

      } catch (error) {
        body.innerHTML =
          '<tr><td colspan="5">Unable to load results.</td></tr>';

        note.textContent =
          "Connection error: " + error.message;
      }
    }

    document.addEventListener("DOMContentLoaded", loadLeaderboard);
  </script>

</body>
</html>
