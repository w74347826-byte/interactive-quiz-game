
<script>
async function loadLeaderboard() {
  const body = document.getElementById("leaderboard-body");
  const note = document.getElementById("leaderboard-note");

  body.innerHTML =
    '<tr><td colspan="5">Loading results...</td></tr>';

  try {
    const response = await fetch(
      "https://wajeehatariq.pythonanywhere.com/api/scores"
    );

    if (!response.ok) {
      throw new Error("HTTP error: " + response.status);
    }

    const results = await response.json();

    if (!Array.isArray(results) || results.length === 0) {
      body.innerHTML =
        '<tr><td colspan="5">No saved results yet.</td></tr>';
      note.textContent = "Complete a quiz to see results here.";
      return;
    }

    results.sort(
      (a, b) => Number(b.pct) - Number(a.pct)
    );

    body.innerHTML = "";

    results.forEach((player, index) => {
      const score = Number(player.score) || 0;
      const total = Number(player.total) || 0;
      const percent = Number(player.pct) || 0;

      let feedback = "Keep practicing!";

      if (percent >= 100) {
        feedback = "Excellent!";
      } else if (percent >= 80) {
        feedback = "Great work!";
      } else if (percent >= 60) {
        feedback = "Good effort!";
      }

      const row = document.createElement("tr");

      [
        index + 1,
        player.name || "Guest",
        player.category || "-",
        score + "/" + total,
        feedback
      ].forEach(value => {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      });

      body.appendChild(row);
    });

    note.textContent =
      "Results successfully received from Python backend.";

  } catch (error) {
    body.innerHTML =
      '<tr><td colspan="5">Unable to load results.</td></tr>';

    note.textContent =
      "Connection error: " + error.message;
  }
}

document.addEventListener("DOMContentLoaded", loadLeaderboard);
      </script>
